<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Home</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Stile custom EpiTunes -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <!-- Riempi via JS in common.js -->
      </aside>

      <main class="main">
        <!-- Header sticky — home btn + searchbar + utente -->
        <header class="topbar">
          <div class="d-flex align-items-center gap-2">
            <!-- Pulsante home -->
            <a href="index.html" class="nav-btn d-flex align-items-center justify-content-center">
              <ion-icon name="home-outline"></ion-icon>
            </a>
            <!-- Barra di ricerca -->
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Cerca brani, album, artisti..."
            />
          </div>
          <!-- Pulsante utente — per ora non interattivo -->
          <button class="user-pill">👤 Utente</button>
        </header>

        <section class="home">
          <!--
            SEZIONI DA COSTRUIRE (vedi js/home.js):
            - "Riprodotti di recente" (da localStorage history)
            - "I tuoi preferiti" (da localStorage favourites)
            - "Suggerimenti pop"
            - "Suggerimenti rock"
            - "Suggerimenti italian pop"
            Ogni sezione è un <section class="row"> con titolo h2 e una griglia di .card.
          -->
        </section>
      </main>

      <footer class="player">
        <!-- Riempi via JS in common.js -->
      </footer>
    </div>

    <audio id="audio-element"></audio>

    <!-- Bootstrap JS — necessario per Modal e Dropdown -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <!-- Script EpiTunes -->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
