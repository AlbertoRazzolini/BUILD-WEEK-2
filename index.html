<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Home</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Stile custom EpiTunes -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===== SIDEBAR (tablet + desktop) =====
           Sotto 540px è nascosta da app.css.
           Su mobile viene sostituita dall'offcanvas Bootstrap (pannello
           laterale che scivola aprendosi dal hamburger nell'header).
           I <li> dei dropdown vengono popolati via cloneNode da Simo/Cris.
      -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <span class="brand-text">EpiTunes</span>
        </div>

        <!-- Filtri — badge fissi, Lucio aggiunge addEventListener per il click -->
        <!-- Al click: Javier fetcha, Simo/Cris popolano #sidebar-filter-results -->
        <p class="sidebar-section-title">Filtri</p>
        <div class="d-flex flex-wrap gap-1 px-2 mb-2">
          <button class="badge bg-secondary" data-filter="artisti">Artisti</button>
          <button class="badge bg-secondary" data-filter="album">Album</button>
          <button class="badge bg-secondary" data-filter="generi">Generi</button>
        </div>

        <!-- Template card filtro — Simo/Cris clonano questo nodo con cloneNode(true)
             e lo popolano prima di appendere in #sidebar-filter-results -->
        <template id="tmpl-filter-result">
          <div class="sidebar-filter-item">
            <span class="ico"></span>          <!-- icona/img — sempre visibile -->
            <span class="filter-label"></span> <!-- testo — nascosto su tablet da app.css -->
          </div>
        </template>

        <!-- Risultati filtro — Simo/Cris appendono qui i cloni del template -->
        <div id="sidebar-filter-results"></div>

        <nav class="sidebar-nav">
          <a href="index.html" class="active">
            <span class="ico"><ion-icon name="home-outline"></ion-icon></span>
            <span>Home</span>
          </a>

          <!-- Collapse Preferiti — <li> popolati via cloneNode da Simo/Cris -->
          <div>
            <a data-bs-toggle="collapse" data-bs-target="#sidebar-favs-list" role="button">
              <span class="ico"><ion-icon name="heart-outline"></ion-icon></span>
              <span>Preferiti</span>
            </a>
            <ul class="collapse" id="sidebar-favs-list">
              <li><span class="dropdown-item text-secondary">Nessuno ancora</span></li>
              <!-- cloneNode Simo/Cris -->
            </ul>
          </div>

          <!-- Collapse Playlist — <li> popolati via cloneNode da Simo/Cris -->
          <div>
            <a data-bs-toggle="collapse" data-bs-target="#sidebar-playlists-list" role="button">
              <span class="ico"><ion-icon name="musical-notes-outline"></ion-icon></span>
              <span>Playlist</span>
            </a>
            <ul class="collapse" id="sidebar-playlists-list">
              <li><span class="dropdown-item text-secondary">Nessuna playlist</span></li>
              <!-- cloneNode Simo/Cris -->
            </ul>
          </div>

        </nav>
      </aside>

      <main class="main">
        <!-- Header sticky — home btn + searchbar + utente -->
        <header class="topbar">
          <div class="d-flex align-items-center gap-2">
            <!-- Pulsante home -->
            <a
              href="index.html"
              class="nav-btn d-flex align-items-center justify-content-center"
            >
              <ion-icon name="home-outline"></ion-icon>
            </a>
            <!-- Barra di ricerca -->
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Cerca brani, album, artisti..."
            />
          </div>
          <!-- Desktop: user pill — visibile da sm (576px) in su -->
          <button class="user-pill d-none d-sm-block">👤 Utente</button>
          <!-- Mobile: hamburger — visibile solo sotto sm (576px) -->
          <button
            class="nav-btn d-sm-none d-flex align-items-center justify-content-center"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobile-menu"
            aria-label="Menu"
          >
            <ion-icon name="menu-outline"></ion-icon>
          </button>
        </header>

        <section class="home">
          <!--
            SEZIONI DA COSTRUIRE (vedi js/home.js):
            - "Riprodotti di recente" (da localStorage history)
            - "I tuoi preferiti" (da localStorage favourites)
            - "Suggerimenti pop"
            - "Suggerimenti rock"
            - "Suggerimenti italian pop"
            Ogni sezione è un <section class="row"> con titolo h2 e una griglia di .card.
          -->
        </section>
      </main>

      <footer class="player">
        <!-- Riempi via JS in common.js -->
      </footer>
    </div>

    <audio id="audio-element"></audio>

    <!-- ===== OFFCANVAS MOBILE =====
         Pannello laterale che scivola aprendosi dal hamburger (sotto 576px).Possibile problema tra 540 e 576, da rivedere nella stilizzazione per fillare il gap.
         Specchia il contenuto della sidebar desktop + pulsante utente.
         I <li> dei dropdown vengono popolati via cloneNode da Simo/Cris.
    -->
    <div
      class="offcanvas offcanvas-start bg-dark text-white"
      tabindex="-1"
      id="mobile-menu"
      aria-labelledby="mobile-menu-label"
    >
      <div class="offcanvas-header border-bottom border-secondary">
        <div class="brand">
          <div class="brand-mark">E</div>
          <span class="brand-text">EpiTunes</span>
        </div>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Chiudi"
        ></button>
      </div>

      <div class="offcanvas-body">
        <!-- Pulsante utente -->
        <button class="user-pill mb-3">👤 Utente</button>

        <nav class="sidebar-nav">
          <a href="index.html" class="active">
            <span class="ico"><ion-icon name="home-outline"></ion-icon></span>
            <span>Home</span>
          </a>

          <!-- Collapse Preferiti — <li> popolati via cloneNode da Simo/Cris -->
          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#mobile-favs-list"
              role="button"
            >
              <span class="ico"
                ><ion-icon name="heart-outline"></ion-icon
              ></span>
              <span>Preferiti</span>
            </a>
            <ul class="collapse" id="mobile-favs-list">
              <li>
                <span class="dropdown-item text-secondary">Nessuno ancora</span>
              </li>
              <!-- cloneNode Simo/Cris -->
            </ul>
          </div>

          <!-- Collapse Playlist — <li> popolati via cloneNode da Simo/Cris -->
          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#mobile-playlists-list"
              role="button"
            >
              <span class="ico"
                ><ion-icon name="musical-notes-outline"></ion-icon
              ></span>
              <span>Playlist</span>
            </a>
            <ul class="collapse" id="mobile-playlists-list">
              <li>
                <span class="dropdown-item text-secondary"
                  >Nessuna playlist</span
                >
              </li>
              <!-- cloneNode Simo/Cris -->
            </ul>
          </div>
        </nav>
      </div>
    </div>

    <!-- Bootstrap JS — necessario per Modal e Dropdown -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <!-- Script EpiTunes -->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
