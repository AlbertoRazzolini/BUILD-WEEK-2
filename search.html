<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Cerca</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Stile custom EpiTunes -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===== SIDEBAR (tablet + desktop) =====
           Sotto 576px è nascosta da app.css.
           Su mobile viene sostituita dall'offcanvas Bootstrap.
           I <li> dei dropdown vengono popolati via cloneNode da Simo/Cris.
      -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <span class="brand-text">EpiTunes</span>
        </div>

        <!-- Filtri — badge fissi, Lucio aggiunge addEventListener per il click -->
        <p class="card-title fs-4 text-secondary d-none d-md-block">Filtri</p>
        <div class="row g-1 mb-4 d-none d-md-flex">
          <div class="col-12 col-lg-4">
            <button
              class="badge bg-secondary w-100 py-2 fs-6"
              data-filter="artisti"
            >
              Artisti
            </button>
          </div>
          <div class="col-12 col-lg-4">
            <button
              class="badge bg-secondary w-100 py-2 fs-6"
              data-filter="album"
            >
              Album
            </button>
          </div>
          <div class="col-12 col-lg-4">
            <button
              class="badge bg-secondary w-100 py-2 fs-6"
              data-filter="generi"
            >
              Generi
            </button>
          </div>
        </div>

        <template id="tmpl-filter-result">
          <div class="sidebar-filter-item">
            <span class="ico"></span>
            <span class="filter-label"></span>
          </div>
        </template>

        <template id="tmpl-album-item">
          <div class="d-flex align-items-center gap-2 p-2">
            <img
              class="album-cover rounded flex-shrink-0"
              src=""
              alt="cover album"
              style="width: 40px; height: 40px; object-fit: cover"
            />
            <div class="overflow-hidden">
              <p class="album-title text-truncate mb-0"></p>
              <p class="album-artist text-truncate mb-0 text-secondary"></p>
            </div>
          </div>
        </template>

        <template id="tmpl-artist-item">
          <div class="d-flex align-items-center gap-2 py-2">
            <img
              class="artist-cover rounded-circle flex-shrink-0"
              src=""
              alt="artista"
              style="width: 40px; height: 40px; object-fit: cover"
            />
            <p class="artist-name text-truncate mb-0"></p>
          </div>
        </template>

        <div id="sidebar-filter-results"></div>

        <nav class="sidebar-nav">
          <template id="tmpl-fav-item">
            <li class="d-flex align-items-center gap-2 p-2">
              <img
                class="fav-cover rounded flex-shrink-0"
                src=""
                alt="cover"
                style="width: 40px; height: 40px; object-fit: cover"
              />
              <div class="overflow-hidden">
                <p class="fav-title text-truncate mb-0"></p>
                <p class="fav-artist text-truncate mb-0 text-secondary"></p>
              </div>
            </li>
          </template>

          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#sidebar-favs-list"
              role="button"
              class="mb-1"
            >
              <span class="ico"
                ><ion-icon name="heart-outline"></ion-icon
              ></span>
              <span>Preferiti</span>
            </a>
            <ul class="collapse" id="sidebar-favs-list"></ul>
          </div>

          <template id="tmpl-playlist-item">
            <li class="d-flex align-items-center gap-2 p-2">
              <span
                class="d-flex align-items-center justify-content-center rounded bg-secondary flex-shrink-0"
                style="width: 40px; height: 40px"
              >
                <ion-icon name="musical-notes-outline"></ion-icon>
              </span>
              <p class="playlist-name text-truncate mb-0"></p>
            </li>
          </template>

          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#sidebar-playlists-list"
              role="button"
              class="mb-1"
            >
              <span class="ico"
                ><ion-icon name="musical-notes-outline"></ion-icon
              ></span>
              <span>Playlist</span>
            </a>
            <ul class="collapse" id="sidebar-playlists-list"></ul>
          </div>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="d-flex align-items-center gap-2">
            <!-- Pulsante home -->
            <a
              href="index.html"
              class="nav-btn d-flex align-items-center justify-content-center"
            >
              <ion-icon name="home-outline"></ion-icon>
            </a>
            <!-- Barra di ricerca -->
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Cerca brani, album, artisti..."
              autocomplete="off"
            />
          </div>
          <!-- Desktop: user pill — visibile da sm (576px) in su -->
          <button class="user-pill d-none d-sm-block">👤 Utente</button>
          <!-- Mobile: hamburger — visibile solo sotto sm (576px) -->
          <button
            class="nav-btn d-sm-none d-flex align-items-center justify-content-center"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobile-menu"
            aria-label="Menu"
          >
            <ion-icon name="menu-outline"></ion-icon>
          </button>
        </header>

        <section class="search">
          <!--
            COSTRUISCI IN search.js:
            - Debounce 400ms su "input" -> chiamata fetch a iTunes search
            - Tre sezioni: brani, album, artisti (Promise.all con entity differenti)
            - Salva ultima query in localStorage; al caricamento, riprendila
            - Click su brano -> Player; click su album/artist -> album.html/artist.html?id=...
          -->
          <div class="search-results">
            <section class="row" id="row-tracks" hidden>
              <h2>Brani</h2>
              <div class="grid" id="grid-tracks"></div>
            </section>
            <section class="row" id="row-albums" hidden>
              <h2>Album</h2>
              <div class="grid" id="grid-albums"></div>
            </section>
            <section class="row" id="row-artists" hidden>
              <h2>Artisti</h2>
              <div class="grid" id="grid-artists"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="player"></footer>
    </div>

    <audio id="audio-element"></audio>

    <!-- ===== OFFCANVAS MOBILE =====
         Pannello laterale che scivola aprendosi dal hamburger (sotto 576px).
         Specchia il contenuto della sidebar desktop + pulsante utente.
         I <li> dei dropdown vengono popolati via cloneNode da Simo/Cris.
    -->
    <div
      class="offcanvas offcanvas-start bg-dark text-white"
      tabindex="-1"
      id="mobile-menu"
      aria-labelledby="mobile-menu-label"
    >
      <div class="offcanvas-header border-bottom border-secondary">
        <div class="brand">
          <div class="brand-mark">E</div>
          <span class="brand-text">EpiTunes</span>
        </div>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Chiudi"
        ></button>
      </div>

      <div class="offcanvas-body">
        <button class="user-pill mb-3">👤 Utente</button>

        <nav class="sidebar-nav">
          <a href="index.html">
            <span class="ico"><ion-icon name="home-outline"></ion-icon></span>
            <span>Home</span>
          </a>

          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#mobile-favs-list"
              role="button"
            >
              <span class="ico"
                ><ion-icon name="heart-outline"></ion-icon
              ></span>
              <span>Preferiti</span>
            </a>
            <ul class="collapse" id="mobile-favs-list">
              <li>
                <span class="dropdown-item text-secondary">Nessuno ancora</span>
              </li>
            </ul>
          </div>

          <div>
            <a
              data-bs-toggle="collapse"
              data-bs-target="#mobile-playlists-list"
              role="button"
            >
              <span class="ico"
                ><ion-icon name="musical-notes-outline"></ion-icon
              ></span>
              <span>Playlist</span>
            </a>
            <ul class="collapse" id="mobile-playlists-list">
              <li>
                <span class="dropdown-item text-secondary"
                  >Nessuna playlist</span
                >
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </div>

    <!-- Bootstrap JS — necessario per Modal e Dropdown -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <!-- Script EpiTunes -->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/search.js"></script>
  </body>
</html>
